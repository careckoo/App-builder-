<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working iPhone on one side, the "your payments arrive" simulator on the other; stacks on phones.
   Palette "Gulf morning" (docs/PRODUCT_SPEC.md §6). Light is the default; the page follows the viewer's theme,
   the phone follows its own Appearance setting (Light by default, like the app). */
:root, .screen[data-look="light"] {
  --bg: #FFFCF6;          /* background */
  --surface: #FFFFFF;     /* surface */
  --surface-2: #F6EFE3;   /* surfaceSecondary, soft sand */
  --track: #F6EFE3;       /* ring track */
  --ink: #1E2A36;         /* textPrimary */
  --muted: #6B7785;       /* textSecondary */
  --line: #EDE4D4;        /* hairline, a step darker than sand */
  --accent: #2E8BEF;      /* Gulf sea blue */
  --accent-text: #1B6FCC; /* accent for small text on white (AA); derived, not a brand token */
  --accent-ink: #FFFFFF;
  --accent-soft: #E6F1FD;
  --sun: #FFC53D;         /* highlight: payday crescent, achievements only */
  --good: #22B573;        /* relaxed */
  --warn: #F5A524;        /* careful */
  --bad: #F2545B;         /* over */
  --note-bg: rgba(255,255,255,.86);
  --phone-frame: #1E2A36;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161C; --surface: #1B2129; --surface-2: #232A33; --track: #232A33; --ink: #EEF2F6; --muted: #9AA6B2;
  --line: #2D353F; --accent: #5AA9FF; --accent-text: #5AA9FF; --accent-ink: #0B1A2B; --accent-soft: #1C2D42;
  --sun: #FFD36B; --good: #3DD68C; --warn: #FFB84D; --bad: #FF7A80; --note-bg: rgba(35,42,51,.88);
  --phone-frame: #05070A; color-scheme: dark; } }
:root[data-theme="dark"], .screen[data-look="dark"] {
  --bg: #12161C; --surface: #1B2129; --surface-2: #232A33; --track: #232A33; --ink: #EEF2F6; --muted: #9AA6B2;
  --line: #2D353F; --accent: #5AA9FF; --accent-text: #5AA9FF; --accent-ink: #0B1A2B; --accent-soft: #1C2D42;
  --sun: #FFD36B; --good: #3DD68C; --warn: #FFB84D; --bad: #FF7A80; --note-bg: rgba(35,42,51,.88);
  --phone-frame: #05070A; color-scheme: dark; }
:root {
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Readex Pro", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  background: radial-gradient(900px 420px at 88% -8%, color-mix(in srgb, var(--sun) 20%, transparent), transparent 70%),
              radial-gradient(800px 420px at 0% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%), var(--bg);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
html[lang="ar"] body { line-height: 1.75; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 40px; }
header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.brand { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.brand .mark { width: 56px; height: 56px; }
.brand h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 46px); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand h1 span { color: var(--accent); }
.brand p { grid-column: 1 / -1; margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { font: 600 13px var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 48px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; } .side { width: 100%; } }

/* ---------- iPhone ---------- */
.phone { width: 360px; max-width: 100%; aspect-ratio: 360 / 760; background: var(--phone-frame); border-radius: 54px; padding: 12px; position: sticky; top: 24px;
  box-shadow: 0 30px 60px -28px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 0 1px color-mix(in srgb, var(--ink) 8%, transparent); }
@media (max-width: 860px) { .phone { position: relative; top: 0; } }
.screen { position: relative; height: 100%; border-radius: 43px; overflow: hidden; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
html[lang="ar"] .screen { line-height: 1.7; }
.statusbar { display: flex; justify-content: space-between; padding: 14px 28px 4px; font: 600 14px var(--font-display); direction: ltr; }
.island { position: absolute; top: 10px; left: 50%; translate: -50% 0; width: 112px; height: 32px; background: #000; border-radius: 20px; z-index: 5; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 16px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.navbar { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin: 6px 0 8px; }
.navbar small { display: block; color: var(--muted); font-size: 12.5px; }
.navtitle { font: 700 30px/1.2 var(--font-display); margin: 0; }
.addbtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font: 500 24px/1 var(--font-display); cursor: pointer; display: grid; place-items: center; margin-bottom: 4px; }
.ringbox { display: grid; place-items: center; margin: 4px 0 6px; position: relative; }
.ringbox svg { width: 224px; height: 224px; max-width: 100%; }
.ringlabel { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 1px; }
.ringlabel small { color: var(--muted); font-size: 12.5px; }
.ringlabel strong { font: 700 36px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.ringlabel .of { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pill { justify-self: center; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; }
.payday { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface); border-radius: 18px; padding: 10px 14px; margin: 0 0 18px; }
.payday svg { width: 40px; height: 40px; }
.payday b { display: block; font: 600 15px var(--font-display); }
.payday small { color: var(--muted); font-size: 12px; }
h3.sec { font: 600 17px var(--font-display); margin: 0 0 8px; }
.list { background: var(--surface); border-radius: 16px; padding: 4px 12px; }
.row { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.new { animation: flash 1.6s ease; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.ico { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 17px; }
.row .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: 6px; padding: 0 5px; }
.row .amt { text-align: end; font: 600 14px var(--font-display); font-variant-numeric: tabular-nums; direction: ltr; }
.row .amt.in { color: var(--good); }
.row .amt small { display: block; font: 400 10.5px var(--font-body); color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 14px 4px; text-align: center; }
.daylabel { font-size: 12px; color: var(--muted); margin: 14px 4px 6px; display: flex; justify-content: space-between; }
.daylabel span:last-child { direction: ltr; font-variant-numeric: tabular-nums; }
.bud { padding: 10px 0; border-bottom: 1px solid var(--line); }
.bud:last-child { border-bottom: 0; }
.bud .top { display: flex; justify-content: space-between; font-size: 13.5px; gap: 8px; }
.bud .top span:last-child { color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--track); border-radius: 6px; margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--accent); transition: width .6s ease; }
.bill { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 8px; }
.bill:last-child { border-bottom: 0; }
.bill .chk { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: inline-grid; place-items: center; font-size: 11px; color: #fff; flex: none; }
.bill .chk.on { background: var(--good); border-color: var(--good); }
.bill > span:first-child { display: flex; gap: 10px; align-items: center; }
.bill > span:last-child { direction: ltr; font-variant-numeric: tabular-nums; }
.income { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; padding: 10px 0; }
.income b { direction: ltr; font-variant-numeric: tabular-nums; }

/* Setup: the three automatic sources */
.source { border-bottom: 1px solid var(--line); }
.source:last-child { border-bottom: 0; }
.source summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; align-items: center; padding: 10px 0; }
.source summary::-webkit-details-marker { display: none; }
.source .sico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; background: var(--surface-2); }
.source .sico.pay { background: var(--ink); color: var(--bg); font: 600 11px var(--font-display); }
.source .t { font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.source .d { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.rec { font-size: 10.5px; font-weight: 600; background: color-mix(in srgb, var(--sun) 35%, transparent); color: var(--ink); border-radius: 6px; padding: 0 6px; }
.state { margin-inline-start: auto; font-size: 11px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.state i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.state.on i { background: var(--good); }
.source ol { margin: 0 0 10px; padding-inline-start: 22px; font-size: 12.5px; color: var(--ink); }
.source ol li { margin: 3px 0; }
.cash { display: flex; gap: 10px; align-items: center; font-size: 13.5px; padding: 12px 0; }
.cash b { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 500 18px/1 var(--font-display); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); background: var(--surface-2); border-radius: 10px; padding: 2px; margin: 10px 0; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 12.5px var(--font-body); padding: 6px 4px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: 1px solid var(--line); padding: 8px 6px 22px; }
.tabbar button { border: 0; background: none; color: var(--muted); font: 500 10.5px var(--font-body); display: grid; gap: 2px; justify-items: center; cursor: pointer; padding: 4px; border-radius: 10px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-selected="true"] { color: var(--accent); }

/* Add-a-payment sheet */
.scrim { position: absolute; inset: 0; background: rgba(15,25,35,.28); z-index: 7; display: flex; align-items: end; }
.sheet { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 18px 30px; display: grid; gap: 10px; }
.sheet::before { content: ""; justify-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet h4 { margin: 0; font: 600 17px var(--font-display); }
.sheet input { width: 100%; font: 15px var(--font-body); color: var(--ink); background: var(--surface-2); border: 0; border-radius: 12px; padding: 10px 12px; }
.sheet .amount { font: 600 22px var(--font-display); direction: ltr; text-align: left; }
.sheet .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Notifications sliding down from the top of the phone */
.notes { position: absolute; top: 50px; left: 10px; right: 10px; display: grid; gap: 8px; z-index: 8; pointer-events: none; }
.note { background: var(--note-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px; padding: 10px 14px; box-shadow: 0 8px 24px -10px rgba(20,40,60,.35); font-size: 12.5px; animation: drop .45s cubic-bezier(.2,.9,.3,1.2); }
.note header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.note header b { color: var(--ink); }
.note p { margin: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.note.out { animation: lift .4s ease forwards; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
@keyframes lift { to { transform: translateY(-30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .note, .note.out, .row.new { animation: none; } .bar i, .ringbox circle { transition: none !important; } }

/* ---------- Simulator side ---------- */
.side { display: grid; gap: 28px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; min-width: 0; }
.card h2 { font: 600 20px var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.card > p { margin: 0 0 16px; color: var(--muted); }
.eyebrow { font: 600 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 6px; }
.samples { display: grid; gap: 8px; }
.sample { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: start; text-align: start; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 10px 12px; cursor: pointer; font: inherit; }
.sample:hover { border-color: var(--accent); }
.sample .from { font: 600 11px var(--font-body); background: var(--accent-soft); color: var(--accent-text); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.sample[data-src="wallet"] .from { background: var(--ink); color: var(--bg); }
.sample[data-src="email"] .from { background: var(--surface-2); color: var(--ink); }
.sample .txt { font: 400 12.5px/1.5 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.sample[data-dir="rtl"] .txt { font-family: var(--font-body); font-size: 13.5px; }
.custom { display: grid; gap: 10px; margin-top: 16px; }
.custom label { font-size: 13px; font-weight: 600; }
.custom textarea, .custom input { width: 100%; font: 13px/1.5 var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; }
.custom .rowx { display: flex; gap: 10px; flex-wrap: wrap; }
.custom .rowx input { flex: 1 1 140px; width: auto; }
.btn { font: 600 14px var(--font-body); border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.parsed { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.parsed div { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.parsed small { display: block; font-size: 11px; color: var(--muted); }
.parsed b { font: 600 14px var(--font-display); overflow-wrap: anywhere; }
.verdict { margin-top: 10px; font-size: 13px; font-weight: 600; }
.verdict.skip { color: var(--ink); border-inline-start: 3px solid var(--warn); padding-inline-start: 8px; }

.flow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
@media (max-width: 620px) { .flow { grid-template-columns: minmax(0,1fr); } }
.flow div { background: var(--surface-2); border-radius: 14px; padding: 14px; }
.flow b { display: block; font: 600 15px var(--font-display); margin-bottom: 4px; }
.flow p { margin: 0; font-size: 13.5px; color: var(--muted); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--font-body); color: var(--muted); letter-spacing: .04em; }
td:first-child { font-weight: 600; }
.yes { color: var(--good); font-weight: 600; }
.no { color: var(--muted); }
.us { background: var(--accent-soft); }
.note-small { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="14" style="fill:var(--accent)"/>

        <circle cx="34" cy="24" r="13" style="fill:var(--accent)"/>
      </svg>
      <h1 data-i18n="heroTitle">Khurda <span>خردة</span></h1>

<script type="module">
import { readMessage, categorize, CATEGORIES } from "./parser.js";

// Keeps amounts and card endings left-to-right inside Arabic sentences (LRI ... PDI).
const ltr = s => "⁦" + s + "⁩";

// ---------- Text in both languages ----------
const T = {
  en: {
    heroTitle: 'Khurda <span>خردة</span>',
    heroSub: "Pay with Apple Pay, or let your UAE bank text or email you as usual. Khurda logs it by itself and keeps one number right: what you can spend today.",
    tryEyebrow: "Try it", tryTitle: "Send the phone a payment",
    trySub: "Tap a sample. It arrives like a real Apple Pay notification, bank SMS or email, a Shortcuts automation hands it to Khurda, and the phone updates. Sample data, not real accounts.",

// ---------- Logic (mirrors SafeToSpend.swift) ----------
function cycle() {
  const start = new Date(2026, 9, SETTINGS.payday), end = new Date(2026, 10, SETTINGS.payday);
  const sod = new Date(2026, 10, 17);
  const daysLeft = Math.max(0, Math.round((end - sod) / 864e5));
  const total = Math.round((end - start) / 864e5);
  return { start, end, daysLeft, progress: Math.min(1, (total - daysLeft) / total) };
}
function safeToSpend() {
  const c = cycle(), sod = new Date(2026, 10, 17);
  const flex = txs.filter(t => isExp(t) && !t.fixed);
  const refunds = txs.filter(t => t.kind === "refund").reduce((s, t) => s + aedOf(t), 0);
  const before = flex.filter(t => t.date < sod).reduce((s, t) => s + aedOf(t), 0) - refunds;
  const today = flex.filter(t => t.date >= sod).reduce((s, t) => s + aedOf(t), 0);
  const income = Math.max(txs.filter(t => t.kind === "income").reduce((s, t) => s + aedOf(t), 0), SETTINGS.income);
  const fixed = BILLS.reduce((s, b) => s + b.amount, 0);
  const avail = income - fixed - SETTINGS.savings - before;
  const allowance = Math.max(0, avail / Math.max(1, c.daysLeft));
  const left = allowance - today, ratio = allowance ? today / allowance : 1;
  const status = left < 0 ? "over" : ratio > .8 ? "careful" : ratio > .4 ? "onTrack" : "relaxed";
  return { today: left, allowance, leftCycle: avail - today, daysLeft: c.daysLeft, progress: c.progress, status };
}

function rowHTML(t) {
  const isNew = t === lastAdded ? " new" : "";
  const amt = (isExp(t) ? "−" : isNeutral(t) ? "" : "+") + fmt(t.amount, 2);
  const label = t.merchant || catName(t.cat);
  const src = srcLabel(t);
  return `<div class="row${isNew}"><div class="ico" aria-hidden="true">${catIcon(t.cat)}</div>

}

// The payday crescent: a sunny moon that fills as payday gets closer (full on payday). Doesn't mirror in RTL.
function crescent(p) {
  const dx = 30 * p;
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><mask id="moonmask"><rect width="40" height="40" fill="#fff"/>
    <circle cx="${20 - dx}" cy="20" r="15.5" fill="#000"/></mask></defs>
    <circle cx="20" cy="20" r="15" style="fill:var(--track)"/>
    <circle cx="20" cy="20" r="15" style="fill:var(--sun)" mask="url(#moonmask)"/></svg>`;
}

function viewToday() {
  const L = T[lang], s = safeToSpend();
  const over = s.today < 0;
  // The ring holds what's left today and empties as you spend; when over, it shows the overspend in coral.
  const frac = s.allowance ? (over ? Math.min(1, -s.today / s.allowance) : s.today / s.allowance) : 0;
  const C = 2 * Math.PI * 94;
  const todays = txs.filter(t => t.date >= new Date(2026, 10, 17)).sort((a, b) => b.date - a.date).slice(0, 3);
  return `<div class="navbar"><div><small>${L.greet} · ${L.dateLine}</small><h2 class="navtitle">${L.tabs[0]}</h2></div>
      <button class="addbtn" data-add aria-label="${esc(L.add)}">+</button></div>
    <div class="ringbox">
      <svg viewBox="0 0 220 220" role="img" aria-label="${esc(L.todayAmount)}: AED ${fmt(Math.max(0, s.today))}">
        <circle cx="110" cy="110" r="94" fill="none" style="stroke:var(--track)" stroke-width="16"/>
        <circle cx="110" cy="110" r="94" fill="none" style="stroke:${statusColor(s.status)};transition: stroke-dashoffset .8s ease, stroke .4s" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 110 110)"/>
      </svg>
      <div class="ringlabel"><small>${L.todayAmount}</small><strong dir="ltr">AED ${fmt(Math.max(0, s.today))}</strong>
        <span class="of">${over ? L.overBy(aed(-s.today)) : L.leftOf(aed(s.allowance))}</span>
        <span class="pill"><i style="background:${statusColor(s.status)}"></i>${L.status[s.status]}</span></div>
    </div>
    <div class="payday">${crescent(s.progress)}<div><b>${L.paydayDays(s.daysLeft)}</b><small>${L.leftPayday(aed(s.leftCycle))}</small></div></div>
    <h3 class="sec">${L.today}</h3>
    <div class="list">${todays.length ? todays.map(rowHTML).join("") : `<div class="empty">${L.noSpend}</div>`}</div>`;
}

function viewActivity() {
  const L = T[lang];
  const groups = {};
  [...txs].sort((a, b) => b.date - a.date).forEach(t => {
    const k = t.date.toDateString(); (groups[k] ||= []).push(t);
  });
  return `<div class="navbar"><h2 class="navtitle">${L.tabs[1]}</h2></div>` + Object.entries(groups).map(([k, items]) => {
    const total = items.filter(isExp).reduce((s, t) => s + aedOf(t), 0);
    const label = new Date(k).toLocaleDateString(lang === "ar" ? "ar-AE-u-nu-latn" : "en-AE", { weekday: "long", day: "numeric", month: "short" });
    return `<div class="daylabel"><span>${label}</span><span>AED ${fmt(total)}</span></div><div class="list">${items.map(rowHTML).join("")}</div>`;
  }).join("");
}

function viewPlan() {
  const L = T[lang], c = cycle();
  const spent = {};
  txs.filter(t => isExp(t) && t.date >= c.start && !t.fixed).forEach(t => spent[t.cat] = (spent[t.cat] || 0) + aedOf(t));
  const buds = BUDGETS.map(([cat, lim]) => {
    const s = spent[cat] || 0, r = s / lim;
    const col = r > 1 ? "var(--bad)" : r > .8 ? "var(--warn)" : "var(--accent)";
    return `<div class="bud"><div class="top"><span>${catIcon(cat)} ${catName(cat)}</span><span>${fmt(s)} / ${fmt(lim)}</span></div>
      <div class="bar"><i style="width:${Math.min(100, r * 100)}%;background:${col}"></i></div></div>`;
  }).join("");
  const bills = BILLS.map(b => `<div class="bill"><span><span class="chk${b.paid ? " on" : ""}">${b.paid ? "✓" : ""}</span>${b[lang]}</span><span>AED ${fmt(b.amount)}</span></div>`).join("");
  return `<div class="navbar"><h2 class="navtitle">${L.tabs[2]}</h2></div>
    <h3 class="sec">${L.incomeT}</h3>
    <div class="list"><div class="income bill"><span>${L.salary}</span><b>AED ${fmt(SETTINGS.income)}</b></div>
      <div class="income bill"><span>${L.paydayOn}</span><span>${L.paydayVal}</span></div></div>
    <h3 class="sec" style="margin-top:18px">${L.bills}</h3><div class="list">${bills}</div>
    <h3 class="sec" style="margin-top:18px">${L.budgets}</h3><div class="list">${buds}</div>`;
}

function viewSetup() {
  const L = T[lang];
  const seen = new Set(txs.flatMap(t => t.src || []));
  const sources = L.sources.map(s => {
    const on = seen.has(s.key);
    return `<details class="source"><summary><span class="sico${s.ico === "Pay" ? " pay" : ""}" aria-hidden="true">${s.ico === "Pay" ? "Pay" : s.ico}</span>
      <span style="min-width:0"><span class="t">${s.title}${s.rec ? `<span class="rec">${s.rec}</span>` : ""}<span class="state${on ? " on" : ""}"><i></i>${on ? L.on : L.waiting[s.key]}</span></span><span class="d">${s.d}</span></span></summary>
      <ol>${s.steps.map(x => `<li>${x}</li>`).join("")}</ol></details>`;
  }).join("");
  return `<div class="navbar"><h2 class="navtitle">${L.tabs[3]}</h2></div>
    <h3 class="sec">${L.setupTitle}</h3>
    <div class="list">${sources}</div>
    <div class="list" style="margin-top:12px"><div class="cash"><b aria-hidden="true">+</b><span>${L.cash}</span></div></div>
    <h3 class="sec" style="margin-top:18px">${L.appearance}</h3>
    <div class="seg" role="group" aria-label="${esc(L.appearance)}">${["light", "dark", "auto"].map(k =>
      `<button data-look="${k}" aria-pressed="${look === k}">${L.looks[k]}</button>`).join("")}</div>
    <p class="empty">${L.privacy}</p>`;
}

function sheetHTML() {
  const L = T[lang];
  return `<div class="scrim" data-sheet-cancel><form class="sheet" id="addform" role="dialog" aria-label="${esc(L.add)}">
    <h4>${L.add}</h4>
    <input class="amount" id="add-amount" inputmode="decimal" placeholder="${esc(L.amountPh)}" aria-label="${esc(L.amountPh)}" autocomplete="off">
    <input id="add-where" dir="auto" placeholder="${esc(L.wherePh)}" aria-label="${esc(L.wherePh)}" autocomplete="off">
    <div class="acts"><button type="button" class="btn ghost" data-sheet-cancel>${L.cancel}</button><button type="submit" class="btn">${L.save}</button></div>
  </form></div>`;
}

function renderPhone() {
  const L = T[lang];
  $("#screen").dataset.look = look;
  $("#view").innerHTML = [viewToday, viewActivity, viewPlan, viewSetup][tab]();
  $("#tabbar").innerHTML = L.tabs.map((name, i) =>
    `<button role="tab" aria-selected="${i === tab}" data-tab="${i}">${ICONS[i]}<span>${name}</span></button>`).join("");
  $("#sheet").innerHTML = sheetOpen ? sheetHTML() : "";
}

function renderSide() {
  const L = T[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = L[el.dataset.i18n]; if (v) el.innerHTML = v; });
  $("#samples").innerHTML = SAMPLES.map((s, i) => {
    const rtl = /[؀-ۿ]/.test(s.msg.slice(0, 6));
    const from = s.src === "wallet" ? "Apple Pay" : s.src === "email" ? `${L.src.email} · ${s.from}` : `SMS · ${s.from}`;
    return `<button class="sample" data-i="${i}" data-src="${s.src}" data-dir="${rtl ? "rtl" : "ltr"}"><span class="from" dir="ltr">${esc(from)}</span><span class="txt" dir="${rtl ? "rtl" : "ltr"}">${esc(s.msg)}</span></button>`;
  }).join("");
  $("#cmp").innerHTML = L.cmpRows.map(([f, ...cells]) => `<tr><td>${f}</td>${cells.map((c, i) => {
    const [y, note] = c.split(/:(.*)/s);
    return `<td class="${i === 2 ? "us" : ""}"><span class="${y}">${y === "yes" ? "✓" : "—"}</span> ${esc(note || "")}</td>`;
  }).join("")}</tr>`).join("");
  $("#lang-en").setAttribute("aria-pressed", lang === "en");
  $("#lang-ar").setAttribute("aria-pressed", lang === "ar");
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
}

function render() { renderSide(); renderPhone(); preview(); }

// ---------- Payment → automation → app ----------
function notify(sender, text, appStyle) {
  const box = $("#notes");
  const n = document.createElement("div");
  n.className = "note";
  const dir = appStyle ? (lang === "ar" ? "rtl" : "ltr") : "auto";
  n.innerHTML = `<header><b>${appStyle ? (lang === "ar" ? "خردة" : "Khurda") : esc(sender)}</b><span>${T[lang].now}</span></header><p dir="${dir}">${esc(text)}</p>`;
  box.prepend(n);
  setTimeout(() => { n.classList.add("out"); setTimeout(() => n.remove(), 400); }, appStyle ? 3200 : 2600);
}

let simClock = new Date(TODAY);
// Logs one transaction from any source: same-source duplicates are dropped, the same purchase reported by
// another source (Apple Pay tap + bank SMS) merges into one row, a matching unpaid bill gets ticked off.
function logTx(t) {
  const L = T[lang];
  // A simulated clock: each payment arrives a minute after the previous one.
  simClock = new Date(simClock.getTime() + 60e3);
  t.date = new Date(simClock);
  // Same rule as DuplicateDetector in the app: same kind, amount, currency, card and merchant within 3 minutes.
  const dup = txs.some(x => x.kind === t.kind && x.amount === t.amount && x.currency === t.currency && x.merchant === t.merchant
    && (x.card || null) === (t.card || null) && Math.abs(x.date - t.date) <= 180e3);
  if (dup) { notify("", L.dup, true); return; }
  // Cross-source merge (spec A2): same amount and currency within 10 minutes, reported by a different source.
  const twin = txs.find(x => isExp(x) && isExp(t) && x.amount === t.amount && x.currency === t.currency
    && Math.abs(x.date - t.date) <= 600e3 && !(x.src || []).includes(t.src[0]) && (!x.card || !t.card || x.card === t.card));
  if (twin) {
    const first = srcLabel(twin);
    twin.src = [...twin.src, t.src[0]];
    if (!twin.merchant || /[؀-ۿ]/.test(twin.merchant)) twin.merchant = t.merchant || twin.merchant;
    lastAdded = twin; tab = 0; renderPhone();
    notify("", L.merged(first), true); return;
  }
  // A payment that matches an unpaid fixed bill ticks it off instead of eating today's amount.
  const bill = BILLS.find(b => !b.paid && b.match === t.cat && Math.abs(b.amount - aedOf(t)) <= Math.max(5, b.amount * .02));
  if (bill && isExp(t)) { bill.paid = true; t.fixed = true; }
  txs.push(t); lastAdded = t;
  tab = bill ? 2 : isNeutral(t) ? 1 : 0;
  renderPhone();
  const s = safeToSpend();
  const where = t.merchant ? ` · ${t.merchant}` : "";
  const money = (c, n) => ltr(`${c} ${fmt(n, 2)}`);
  notify("", isExp(t) ? `${money(t.currency, t.amount)}${where}. ${L.logged}: ${ltr("AED " + fmt(Math.max(0, s.today)))}`
    : isNeutral(t) ? `${L.kinds[t.kind]}: ${money(t.currency, t.amount)} · ${L.neutral}`
    : `+${money(t.currency, t.amount)}${where}`, true);
}

function deliver(sample) {
  if (sample.src === "wallet") {
    // Wallet path: the Transaction automation passes amount and merchant only, so build the transaction directly.
    notify("Wallet", sample.msg, false);
    const w = sample.wallet;
    setTimeout(() => logTx({ merchant: w.merchant, amount: w.amount, currency: w.currency, kind: "purchase",
      cat: categorize({ kind: "purchase", merchant: w.merchant }), card: w.card, src: ["wallet"] }), 1100);
    return;
  }
  notify(sample.from, sample.subject ? `${sample.subject} · ${sample.msg}` : sample.msg, false);
  setTimeout(() => {
    const { parsed: p, isEmail } = readMessage(sample.msg, sample.from, sample.subject || null);
    if (!p) { notify("", T[lang].skipped, true); return; }
    logTx({ merchant: p.merchant || "", amount: p.amount, currency: p.currency, kind: p.kind, cat: categorize(p),
      card: p.cardLast4, src: [isEmail ? "email" : "sms"] });
  }, 1100);
}

function preview() {
  const L = T[lang], msg = $("#custom-msg").value.trim();
  if (!msg) { $("#preview").innerHTML = ""; return; }
  const p = readMessage(msg, $("#custom-sender").value || null).parsed;
  if (!p) { $("#preview").innerHTML = `<div class="verdict skip">${L.willSkip}</div>`; return; }
  const cells = [[L.pAmount, `${p.currency} ${fmt(p.amount, 2)}`], [L.pType, L.kinds[p.kind]], [L.pWhere, p.merchant || "—"],
    [L.pCard, p.cardLast4 ? "•••• " + p.cardLast4 : "—"], [L.pCat, catIcon(categorize(p)) + " " + catName(categorize(p))],
    [L.pBal, p.balanceAfter != null ? fmt(p.balanceAfter, 2) : "—"]];
  $("#preview").innerHTML = `<div class="parsed">${cells.map(([k, v]) => `<div><small>${k}</small><b dir="auto">${esc(v)}</b></div>`).join("")}</div>`;
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = +tb.dataset.tab; lastAdded = null; renderPhone(); return; }
  const lk = e.target.closest("button[data-look]");
  if (lk) { look = lk.dataset.look; try { localStorage.setItem("khurda-look", look); } catch {} renderPhone(); return; }
  if (e.target.closest("[data-add]")) { sheetOpen = true; renderPhone(); $("#add-amount").focus(); return; }
  if (e.target.matches("[data-sheet-cancel]")) { sheetOpen = false; renderPhone(); return; }
  const sm = e.target.closest(".sample");
  if (sm) deliver(SAMPLES[+sm.dataset.i]);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "addform") return;
  e.preventDefault();
  const amount = parseFloat($("#add-amount").value.replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[,٬\s]/g, "").replace("٫", "."));
  if (!(amount > 0)) { $("#add-amount").focus(); return; }
  const merchant = $("#add-where").value.trim();
  sheetOpen = false;
  // Hand-added payments are usually cash: no merchant means the Cash category.
  logTx({ merchant, amount, currency: "AED", kind: "purchase", cat: merchant ? categorize({ kind: "purchase", merchant }) : "cash", src: ["manual"] });
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetOpen) { sheetOpen = false; renderPhone(); } });
$("#send-custom").addEventListener("click", () => {
  const msg = $("#custom-msg").value.trim();
  if (msg) deliver({ src: "sms", from: $("#custom-sender").value.trim() || "Bank", msg });
});
$("#custom-msg").addEventListener("input", preview);
$("#custom-sender").addEventListener("input", preview);
for (const l of ["en", "ar"]) $("#lang-" + l).addEventListener("click", () => {
  lang = l; try { localStorage.setItem("khurda-lang", l); } catch {}
  render();
});

render();
</script>
