# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
# Then open Khurda.xcodeproj and run on an iPhone (iOS 17+).
# Bundle ID and signing team are set once, below, under settings.base (APP_BUNDLE_ID, DEVELOPMENT_TEAM).
name: Khurda
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # Xcode 15.x can only open project format 60 or lower; XcodeGen 2.48 defaults to 77 (Xcode 16).
  projectFormat: xcode15_3
packages:
  KhurdaCore:
    path: KhurdaCore
settings:
  base:
    # The one place to change identifiers. The widget's ID must start with the app's ID.
    APP_BUNDLE_ID: ae.khurda.app
    # Your 10-character Apple Team ID (developer.apple.com > Membership). Empty = pick it in Xcode > Signing.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Xcode's build setting takes the language mode ("5.0"), not the compiler version; Swift 5.10 compilers use it.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Khurda:
    type: application
    platform: iOS
    sources:
      - Khurda
    dependencies:
      - package: KhurdaCore
      - target: KhurdaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    entitlements:
      path: Khurda/Resources/Khurda.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.khurda.shared]
    info:
      path: Khurda/Resources/Info.plist
      properties:
        # English name; the Arabic «خردة» comes from Khurda/Resources/InfoPlist.xcstrings.
        CFBundleDisplayName: Khurda
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  KhurdaWidget:
    type: app-extension
    platform: iOS
    sources:
      - KhurdaWidget
      - Khurda/Models/Models.swift
      - Khurda/Intents/TransactionLogger.swift
      - Khurda/App/Theme.swift
      - Khurda/Resources/Localizable.xcstrings
    dependencies:
      - package: KhurdaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
    entitlements:
      path: KhurdaWidget/KhurdaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.khurda.shared]
    info:
      path: KhurdaWidget/Info.plist
      properties:
        # Arabic name from KhurdaWidget/InfoPlist.xcstrings.
        CFBundleDisplayName: Khurda
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
