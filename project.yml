# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
# Then open Masroofi.xcodeproj and run on an iPhone (iOS 17+).
# Bundle ID and signing team are set once, below, under settings.base (APP_BUNDLE_ID, DEVELOPMENT_TEAM).
name: Masroofi
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  MasroofiCore:
    path: MasroofiCore
settings:
  base:
    # The one place to change identifiers. The widget's ID must start with the app's ID.
    APP_BUNDLE_ID: ae.masroofi.app
    # Your 10-character Apple Team ID (developer.apple.com > Membership). Empty = pick it in Xcode > Signing.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Xcode's build setting takes the language mode ("5.0"), not the compiler version; Swift 5.10 compilers use it.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Masroofi:
    type: application
    platform: iOS
    sources:
      - Masroofi
    dependencies:
      - package: MasroofiCore
      - target: MasroofiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    entitlements:
      path: Masroofi/Resources/Masroofi.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.masroofi.shared]
    info:
      path: Masroofi/Resources/Info.plist
      properties:
        CFBundleDisplayName: Masroofi
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  MasroofiWidget:
    type: app-extension
    platform: iOS
    sources:
      - MasroofiWidget
      - Masroofi/Models/Models.swift
      - Masroofi/Intents/TransactionLogger.swift
      - Masroofi/App/Theme.swift
      - Masroofi/Resources/Localizable.xcstrings
    dependencies:
      - package: MasroofiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
    entitlements:
      path: MasroofiWidget/MasroofiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.masroofi.shared]
    info:
      path: MasroofiWidget/Info.plist
      properties:
        CFBundleDisplayName: Masroofi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
