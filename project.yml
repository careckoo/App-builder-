# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
# Then open Masroofi.xcodeproj, set your Team under Signing, and run on an iPhone (iOS 17+).
name: Masroofi
options:
  bundleIdPrefix: ae.masroofi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  MasroofiCore:
    path: MasroofiCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Masroofi:
    type: application
    platform: iOS
    sources:
      - Masroofi
    dependencies:
      - package: MasroofiCore
      - target: MasroofiWidget
    entitlements:
      path: Masroofi/Resources/Masroofi.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.masroofi.shared]
    info:
      path: Masroofi/Resources/Info.plist
      properties:
        CFBundleDisplayName: Masroofi
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  MasroofiWidget:
    type: app-extension
    platform: iOS
    sources:
      - MasroofiWidget
      - Masroofi/Models/Models.swift
      - Masroofi/Intents/TransactionLogger.swift
      - Masroofi/App/Theme.swift
    dependencies:
      - package: MasroofiCore
    entitlements:
      path: MasroofiWidget/MasroofiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.masroofi.shared]
    info:
      path: MasroofiWidget/Info.plist
      properties:
        CFBundleDisplayName: Masroofi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
