# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
# Then open Sarfi.xcodeproj and run on an iPhone (iOS 17+).
# Bundle ID and signing team are set once, below, under settings.base (APP_BUNDLE_ID, DEVELOPMENT_TEAM).
name: Sarfi
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  SarfiCore:
    path: SarfiCore
settings:
  base:
    # The one place to change identifiers. The widget's ID must start with the app's ID.
    APP_BUNDLE_ID: ae.sarfi.app
    # Your 10-character Apple Team ID (developer.apple.com > Membership). Empty = pick it in Xcode > Signing.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Xcode's build setting takes the language mode ("5.0"), not the compiler version; Swift 5.10 compilers use it.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Sarfi:
    type: application
    platform: iOS
    sources:
      - Sarfi
    dependencies:
      - package: SarfiCore
      - target: SarfiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    entitlements:
      path: Sarfi/Resources/Sarfi.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.sarfi.shared]
    info:
      path: Sarfi/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sarfi
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  SarfiWidget:
    type: app-extension
    platform: iOS
    sources:
      - SarfiWidget
      - Sarfi/Models/Models.swift
      - Sarfi/Intents/TransactionLogger.swift
      - Sarfi/App/Theme.swift
      - Sarfi/Resources/Localizable.xcstrings
    dependencies:
      - package: SarfiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
    entitlements:
      path: SarfiWidget/SarfiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.sarfi.shared]
    info:
      path: SarfiWidget/Info.plist
      properties:
        CFBundleDisplayName: Sarfi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
